<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MHFADev — Colored Interface Lab</title>
  <desc id="desc">A colorful developer dashboard with profile signals, technology stack, and a live build panel.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B1B"/>
      <stop offset="0.52" stop-color="#101942"/>
      <stop offset="1" stop-color="#1F1140"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="170" y1="0" x2="1000" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#E2E8F0" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="500" rx="28" fill="url(#background)"/>
  <rect width="1200" height="500" rx="28" fill="url(#grid)"/>
  <circle cx="1030" cy="52" r="180" fill="#F472B6" fill-opacity="0.24" filter="url(#blur)"/>
  <circle cx="200" cy="70" r="160" fill="#22D3EE" fill-opacity="0.18" filter="url(#blur)"/>
  <path d="M0 0H1200V230C922 134 636 284 385 206C234 159 100 166 0 222V0Z" fill="url(#topGlow)"/>

  <g transform="translate(46 42)">
    <rect width="1108" height="52" rx="14" fill="#0B1028" fill-opacity="0.76" stroke="#A5B4FC" stroke-opacity="0.18"/>
    <circle cx="28" cy="26" r="6" fill="#FB7185"/>
    <circle cx="48" cy="26" r="6" fill="#FBBF24"/>
    <circle cx="68" cy="26" r="6" fill="#4ADE80"/>
    <rect x="102" y="15" width="274" height="22" rx="11" fill="#1E2A56"/>
    <text x="121" y="30" fill="#C7D2FE" font-family="monospace" font-size="12" font-weight="600">mhfadev.dev / interface-lab</text>
    <rect x="934" y="13" width="145" height="26" rx="13" fill="#0F766E" fill-opacity="0.55" stroke="#2DD4BF" stroke-opacity="0.5"/>
    <circle cx="955" cy="26" r="4" fill="#5EEAD4"/>
    <text x="968" y="30" fill="#CCFBF1" font-family="monospace" font-size="11" font-weight="700">NOW BUILDING</text>
  </g>

  <g transform="translate(48 126)">
    <text x="0" y="22" fill="#67E8F9" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">COLORED INTERFACE LAB</text>
    <text x="0" y="84" fill="#F8FAFC" font-family="sans-serif" font-size="52" font-weight="800" letter-spacing="-1">MHFADev</text>
    <text x="0" y="120" fill="#CBD5E1" font-family="sans-serif" font-size="19" font-weight="400">Turning raw ideas into vivid web experiences.</text>
    <rect x="0" y="150" width="164" height="38" rx="19" fill="url(#cyanPurple)"/>
    <text x="23" y="174" fill="#081120" font-family="sans-serif" font-size="13" font-weight="800">FRONTEND SYSTEMS</text>
    <rect x="177" y="150" width="136" height="38" rx="19" fill="#1E293B" stroke="#64748B" stroke-opacity="0.55"/>
    <text x="199" y="174" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="700">AI-ASSISTED</text>
  </g>

  <g transform="translate(48 347)" filter="url(#shadow)">
    <rect width="209" height="112" rx="18" fill="#111A3A" stroke="#22D3EE" stroke-opacity="0.35"/>
    <rect width="209" height="6" rx="3" fill="url(#cyanPurple)"/>
    <text x="20" y="38" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.3">FOCUS</text>
    <text x="20" y="66" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">Interfaces that feel</text>
    <text x="20" y="89" fill="#67E8F9" font-family="sans-serif" font-size="18" font-weight="700">effortless.</text>

    <rect x="225" width="209" height="112" rx="18" fill="#111A3A" stroke="#A78BFA" stroke-opacity="0.35"/>
    <rect x="225" width="209" height="6" rx="3" fill="url(#purplePink)"/>
    <text x="245" y="38" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.3">STACK</text>
    <text x="245" y="66" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">React · Next.js</text>
    <text x="245" y="89" fill="#C4B5FD" font-family="sans-serif" font-size="18" font-weight="700">Tailwind · TypeScript</text>

    <rect x="450" width="209" height="112" rx="18" fill="#111A3A" stroke="#FBBF24" stroke-opacity="0.34"/>
    <rect x="450" width="209" height="6" rx="3" fill="#FBBF24"/>
    <text x="470" y="38" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.3">MODE</text>
    <text x="470" y="66" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700">Design. Develop.</text>
    <text x="470" y="89" fill="#FCD34D" font-family="sans-serif" font-size="18" font-weight="700">Refine. Ship.</text>
  </g>

  <g transform="translate(754 128)" filter="url(#shadow)">
    <rect width="400" height="330" rx="24" fill="#0A1028" fill-opacity="0.92" stroke="#C4B5FD" stroke-opacity="0.33"/>
    <rect x="20" y="20" width="360" height="36" rx="11" fill="#141F45"/>
    <circle cx="42" cy="38" r="5" fill="#22D3EE"/>
    <text x="58" y="43" fill="#CBD5E1" font-family="monospace" font-size="12" font-weight="700">LIVE_BUILD / 01</text>
    <text x="326" y="43" fill="#5EEAD4" font-family="monospace" font-size="11" font-weight="700">ACTIVE</text>

    <text x="24" y="91" fill="#64748B" font-family="monospace" font-size="11" font-weight="600">01</text>
    <text x="56" y="91" fill="#F472B6" font-family="monospace" font-size="14" font-weight="700">const</text>
    <text x="98" y="91" fill="#E2E8F0" font-family="monospace" font-size="14">project</text>
    <text x="155" y="91" fill="#E2E8F0" font-family="monospace" font-size="14">=</text>
    <text x="173" y="91" fill="#A5F3FC" font-family="monospace" font-size="14">{</text>

    <text x="24" y="121" fill="#64748B" font-family="monospace" font-size="11" font-weight="600">02</text>
    <text x="78" y="121" fill="#C4B5FD" font-family="monospace" font-size="14">status</text>
    <text x="125" y="121" fill="#E2E8F0" font-family="monospace" font-size="14">:</text>
    <text x="145" y="121" fill="#86EFAC" font-family="monospace" font-size="14">'in progress'</text>

    <text x="24" y="151" fill="#64748B" font-family="monospace" font-size="11" font-weight="600">03</text>
    <text x="78" y="151" fill="#C4B5FD" font-family="monospace" font-size="14">intent</text>
    <text x="127" y="151" fill="#E2E8F0" font-family="monospace" font-size="14">:</text>
    <text x="145" y="151" fill="#FDE68A" font-family="monospace" font-size="14">'make it useful'</text>

    <text x="24" y="181" fill="#64748B" font-family="monospace" font-size="11" font-weight="600">04</text>
    <text x="78" y="181" fill="#C4B5FD" font-family="monospace" font-size="14">home</text>
    <text x="119" y="181" fill="#E2E8F0" font-family="monospace" font-size="14">:</text>
    <text x="145" y="181" fill="#F9A8D4" font-family="monospace" font-size="14">'Indonesia'</text>

    <text x="24" y="211" fill="#64748B" font-family="monospace" font-size="11" font-weight="600">05</text>
    <text x="56" y="211" fill="#A5F3FC" font-family="monospace" font-size="14">}</text>

    <rect x="20" y="237" width="360" height="72" rx="15" fill="#111B3F"/>
    <text x="38" y="263" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1.2">PROGRESS SIGNAL</text>
    <rect x="38" y="280" width="295" height="8" rx="4" fill="#28355F"/>
    <rect x="38" y="280" width="220" height="8" rx="4" fill="url(#cyanPurple)"/>
    <circle cx="258" cy="284" r="8" fill="#FBBF24" stroke="#FEF3C7" stroke-width="3"/>
    <text x="341" y="289" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="700">74%</text>
  </g>
</svg>
